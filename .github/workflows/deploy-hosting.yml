name: Deploy website

on:
  push:
    branches: [main]
    paths: ["frontend/**", "firebase.json", ".github/workflows/deploy-hosting.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # keyless login to Google Cloud

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Runs once infra/setup-gcp.sh has been run and its output saved as repository variables.
    if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@13 deploy --only hosting --project copper-index-509815-k3 --non-interactive
